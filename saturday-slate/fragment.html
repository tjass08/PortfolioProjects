<title>Saturday Slate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ===== Saturday Slate — theme tokens ===== */
:root{
  --ground:#E7EAF0; --surface:#FFFFFF; --surface-2:#F2F4F8; --elev:#FFFFFF;
  --ink:#141A24; --ink-soft:#39424F; --muted:#69727F; --line:#D6DBE3; --line-soft:#E4E8EE;
  --accent:#A9791A; --accent-2:#7A5610; --accent-fill:#F1D089; --accent-ink:#3d2c00;
  --navy:#152238; --navy-2:#1d3050; --on-navy:#EAF0F8; --on-navy-mut:#9fb0c9;
  --toss:#1f6fb0; --live:#C81E2B; --good:#1F7A4D;
  --iowa:#0c0c0c; --iowa-gold:#FFCD00; --isu:#C8102E; --isu-gold:#E5A823;
  --min:#4F2683; --min-gold:#FFC62F; --ank:#E8541E; --cen:#13284B; --cen-gold:#C9A227;
  --shadow:0 1px 2px rgba(16,22,34,.05), 0 10px 30px rgba(16,22,34,.07);
  --shadow-sm:0 1px 2px rgba(16,22,34,.06);
  --radius:12px; --radius-sm:8px;
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Libre Franklin',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0A0E15; --surface:#131A25; --surface-2:#1A2331; --elev:#18212F;
  --ink:#EEF2F7; --ink-soft:#C6CEDA; --muted:#8B97A7; --line:#28323F; --line-soft:#1f2937;
  --accent:#E7B44E; --accent-2:#F2C86A; --accent-fill:#4a3a10; --accent-ink:#F5DFA6;
  --navy:#0C1522; --navy-2:#12233b; --on-navy:#EAF0F8; --on-navy-mut:#8fa1bb;
  --toss:#5aa2e6; --live:#F0555F; --good:#3fbb7c; --isu-gold:#E5A823;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --ground:#0A0E15; --surface:#131A25; --surface-2:#1A2331; --elev:#18212F;
  --ink:#EEF2F7; --ink-soft:#C6CEDA; --muted:#8B97A7; --line:#28323F; --line-soft:#1f2937;
  --accent:#E7B44E; --accent-2:#F2C86A; --accent-fill:#4a3a10; --accent-ink:#F5DFA6;
  --navy:#0C1522; --navy-2:#12233b; --on-navy:#EAF0F8; --on-navy-mut:#8fa1bb;
  --toss:#5aa2e6; --live:#F0555F; --good:#3fbb7c; --isu-gold:#E5A823;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px; margin:0 auto; padding-inline:16px}
h1,h2,h3{margin:0; font-family:var(--font-display); font-weight:600; text-wrap:balance; letter-spacing:.01em}
button{font-family:inherit; cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}

/* topbar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line)}
.topbar-in{display:flex; align-items:center; gap:14px; padding-block:11px}
.brand{display:flex; flex-direction:column; line-height:1; margin-right:auto; min-width:0}
.brand .mark{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:.02em; text-transform:uppercase; display:flex; align-items:center; gap:9px}
.brand .mark b{color:var(--accent-2)}
.pigskin{width:19px;height:19px;flex:none;color:var(--accent-2)}
.brand .sub{font-size:11.5px; color:var(--muted); margin-top:4px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-btn{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-sm); transition:transform .12s, border-color .12s}
.tb-btn:hover{border-color:var(--accent)}
.tb-btn:active{transform:translateY(1px)}
.tb-btn svg{width:16px;height:16px}
.tb-btn.primary{background:var(--accent); border-color:var(--accent); color:#1a1204}
.icon-btn{padding:8px; width:38px; justify-content:center}
.sun{display:none} .moon{display:block}
:root[data-theme="dark"] .sun{display:block} :root[data-theme="dark"] .moon{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sun{display:block} :root:not([data-theme="light"]) .moon{display:none} }
.hide-sm{display:inline}
@media (max-width:560px){ .hide-sm{display:none} .brand .sub{display:none} }

/* league switcher */
.league-nav{position:sticky; top:calc(env(safe-area-inset-top,0px) + 54px); z-index:30; background:var(--ground); padding-block:12px; border-bottom:1px solid var(--line-soft)}
.league-nav-in{display:flex; gap:8px}
.lg-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 8px; box-shadow:var(--shadow-sm); transition:border-color .12s, transform .12s; min-width:0}
.lg-btn .t{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:15px; color:var(--ink); line-height:1}
.lg-btn .s{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.lg-btn:hover{border-color:var(--accent)}
.lg-btn[aria-pressed="true"]{border-color:transparent; background:var(--navy)}
.lg-btn[aria-pressed="true"] .t{color:#fff}
.lg-btn[aria-pressed="true"] .s{color:var(--on-navy-mut)}

/* hero */
.hero{margin-top:20px; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); color:var(--on-navy); position:relative; isolation:isolate;
  background:radial-gradient(120% 140% at 88% -20%, var(--navy-2), transparent 60%), linear-gradient(180deg, var(--navy), #0c1626)}
.hero::before{content:""; position:absolute; inset:0; z-index:-1; opacity:.5; background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 76px)}
.hero-in{padding:22px 20px 24px}
.hero-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.gow-tag{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.16em; font-weight:700; font-size:12px; color:#0f1a2c; background:var(--accent); padding:5px 11px; border-radius:6px}
.hero-when{color:var(--on-navy-mut); font-size:12.5px; font-weight:600; letter-spacing:.04em}
.hero-when b{color:var(--on-navy)}
.hero-match{font-family:var(--font-display); font-weight:600; line-height:1.02; font-size:clamp(28px, 6.6vw, 54px); letter-spacing:.005em; margin:2px 0 4px}
.hero-match .at{color:var(--on-navy-mut); font-weight:300; font-size:.6em; padding:0 .18em; font-style:italic}
.hero-match .rk{vertical-align:.3em; font-size:.34em; color:var(--accent-2); font-weight:700; margin-right:.14em; font-family:var(--font-mono)}
.hero-venue{color:var(--on-navy-mut); font-size:13px; margin-bottom:16px}
.hero-strip{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; border-top:1px solid rgba(255,255,255,.14); padding-top:16px}
.hero-stat{display:flex; flex-direction:column; gap:3px}
.hero-stat .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--on-navy-mut)}
.hero-stat .v{font-family:var(--font-mono); font-size:16px; font-weight:600; color:var(--on-navy)}
.hero-stat .v.fav{color:var(--accent-2)}
.hero-tidbit{margin:16px 0 0; max-width:64ch; color:#dbe4f0; font-size:14.5px; line-height:1.55}
.hero-tidbit b{color:#fff}

/* section headings */
.sec{margin-top:30px}
.sec-head{display:flex; align-items:baseline; gap:12px; margin-bottom:15px; flex-wrap:wrap}
.sec-head h2{font-size:22px; font-weight:600; letter-spacing:.01em; text-transform:uppercase}
.sec-head .note{font-size:12.5px; color:var(--muted)}
.rule{flex:1; height:1px; background:var(--line); min-width:24px}

/* team panels */
.teams{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:720px){ .teams{grid-template-columns:1fr} }
.teams.one{grid-template-columns:1fr; max-width:560px}
.team{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; display:flex; flex-direction:column}
.team-bar{height:6px}
.team[data-team="iowa"] .team-bar{background:linear-gradient(90deg,var(--iowa),#000 60%,var(--iowa-gold))}
.team[data-team="isu"] .team-bar{background:linear-gradient(90deg,var(--isu),#8a0b20 60%,var(--isu-gold))}
.team[data-team="min"] .team-bar{background:linear-gradient(90deg,var(--min),#2e1550 55%,var(--min-gold))}
.team[data-team="ank"] .team-bar{background:linear-gradient(90deg,var(--ank),#111 70%)}
.team[data-team="cen"] .team-bar{background:linear-gradient(90deg,var(--cen),#0a1830 55%,var(--cen-gold))}
.team-in{padding:16px 16px 6px}
.team-id{display:flex; align-items:flex-start; gap:11px; margin-bottom:12px}
.team-logo{width:42px; height:42px; border-radius:9px; flex:none; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.01em}
.team[data-team="iowa"] .team-logo{background:var(--iowa); color:var(--iowa-gold); box-shadow:inset 0 0 0 1px rgba(255,205,0,.5)}
.team[data-team="isu"] .team-logo{background:var(--isu); color:#fff}
.team[data-team="min"] .team-logo{background:var(--min); color:var(--min-gold)}
.team[data-team="ank"] .team-logo{background:#111; color:var(--ank)}
.team[data-team="cen"] .team-logo{background:var(--cen); color:var(--cen-gold)}
.team-name{font-size:20px; font-weight:600; line-height:1.05; text-transform:uppercase}
.team-meta{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line-soft)}
.chip.rank{background:var(--accent); color:#1a1204; border-color:transparent}
.team-game{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:12px}
.team-game .op{font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:.01em}
.team-game .op small{color:var(--muted); font-weight:400; font-family:var(--font-body); font-size:12px}
.tg-line{display:flex; gap:14px; margin-left:auto; flex-wrap:wrap}
.tg-line .b{display:flex; flex-direction:column; gap:1px}
.tg-line .k{font-size:9.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.tg-line .v{font-family:var(--font-mono); font-size:13.5px; font-weight:600}
.tg-line .v.fav{color:var(--accent-2)}
.team-blurb{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 14px}
.team-blurb b{color:var(--ink)}
.ranks{border-top:1px solid var(--line-soft); margin-top:auto}
.ranks-toggle{width:100%; display:flex; align-items:center; gap:8px; background:none; border:0; padding:12px 16px; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.1em; font-weight:600; font-size:12.5px; color:var(--ink)}
.ranks-toggle .cnt{color:var(--muted); font-weight:400; letter-spacing:.02em; font-family:var(--font-body)}
.ranks-toggle .chev{margin-left:auto; transition:transform .18s; color:var(--muted)}
.ranks-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ranks-body{padding:0 16px 16px}
.rtbl-wrap{overflow-x:auto}
.rtbl{width:100%; border-collapse:collapse; font-size:13px}
.rtbl caption{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-2); font-weight:700; padding:12px 0 6px; font-family:var(--font-display)}
.rtbl th,.rtbl td{padding:7px 10px; text-align:right; border-bottom:1px solid var(--line-soft); white-space:nowrap}
.rtbl th:first-child,.rtbl td:first-child{text-align:left; padding-left:0}
.rtbl thead th{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600; border-bottom-color:var(--line)}
.rtbl td.m{font-weight:500; color:var(--ink)}
.rtbl td.v{font-family:var(--font-mono); color:var(--ink-soft)}
.rtbl td.r{font-family:var(--font-mono); font-weight:600}
.rtbl td.top{color:var(--good)}
.rtbl td.top::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-right:6px; vertical-align:middle}
.rank-note{font-size:11px; color:var(--muted); line-height:1.5; margin:10px 0 0}

/* controls / filters */
.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; box-shadow:var(--shadow-sm); flex-wrap:wrap}
.seg button{border:0; background:none; color:var(--ink-soft); font-weight:600; font-size:12.5px; padding:7px 12px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; transition:color .12s}
.seg button .n{font-family:var(--font-mono); font-size:11px; color:var(--muted); background:var(--surface); border-radius:999px; padding:0 6px; line-height:16px}
.seg button[aria-pressed="true"]{background:var(--accent); color:#1a1204; box-shadow:var(--shadow-sm)}
.seg button[aria-pressed="true"] .n{color:#3d2c00; background:rgba(255,255,255,.5)}
.ctz{margin-left:auto; font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
.ctz b{color:var(--ink-soft)}

/* slate grid */
.slate{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.game{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; display:flex; flex-direction:column; transition:border-color .14s, box-shadow .14s}
.game:hover{border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow:var(--shadow)}
.game.mw{border-top:3px solid var(--live)}
.game-toggle{text-align:left; background:none; border:0; padding:14px 15px 13px; color:inherit; display:flex; flex-direction:column; gap:10px; width:100%}
.game.flat .game-toggle{cursor:default}
.g-row1{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.g-time{font-family:var(--font-mono); font-weight:600; font-size:14px}
.g-day{font-family:var(--font-display); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px}
.g-day.alt{color:#fff; background:var(--live); border-color:transparent}
.tv{margin-left:auto; font-size:11px; font-weight:600; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line-soft); border-radius:6px; padding:3px 8px; white-space:nowrap}
.g-match{font-family:var(--font-display); font-weight:500; font-size:19px; line-height:1.12; letter-spacing:.005em}
.g-match .at{color:var(--muted); font-weight:300; font-style:italic; font-size:.72em; padding:0 .12em}
.g-match .rk{font-size:.6em; color:var(--accent-2); font-weight:700; margin-right:.12em; font-family:var(--font-mono); vertical-align:.12em}
.g-bottom{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.fav{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:600; font-size:12.5px; color:var(--accent-ink); background:var(--accent-fill); border-radius:999px; padding:3px 11px}
.fav .lab{font-family:var(--font-body); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.7}
.g-tags{display:inline-flex; gap:6px; margin-left:auto; flex-wrap:wrap}
.tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:2px 7px; border-radius:5px; color:var(--muted); border:1px solid var(--line-soft)}
.tag.mustwatch{color:var(--live); border-color:color-mix(in srgb,var(--live) 40%, transparent)}
.tag.slot{color:var(--toss); border-color:color-mix(in srgb,var(--toss) 40%, transparent)}
.tag.conf{color:var(--accent-2); border-color:color-mix(in srgb,var(--accent) 35%, transparent)}
.g-tidbit{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0}
.g-tidbit .more-hint{color:var(--accent-2); font-weight:600; font-size:11.5px; white-space:nowrap}
.game-more{border-top:1px dashed var(--line); padding:13px 15px 15px; display:flex; flex-direction:column; gap:12px}
.qs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.qs li{position:relative; padding-left:16px; font-size:12.5px; color:var(--ink-soft); line-height:1.45}
.qs li::before{content:""; position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:1px; background:var(--accent); transform:rotate(45deg)}
.why{font-size:12.5px; color:var(--ink); background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; padding:9px 12px; line-height:1.5}
.why b{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--accent-2); display:block; margin-bottom:2px; font-weight:600}
.ou{font-family:var(--font-mono); font-size:11.5px; color:var(--muted)}
.empty{grid-column:1/-1; text-align:center; color:var(--muted); font-size:13px; padding:28px 0}

/* poll strip */
.poll{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:14px 0}
.poll h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink); padding:0 16px; margin-bottom:11px; display:flex; align-items:center; gap:10px}
.poll h3 small{color:var(--muted); font-family:var(--font-body); font-weight:400; letter-spacing:.02em; text-transform:none; font-size:11.5px}
.poll-row{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 6px; scrollbar-width:thin}
.pchip{flex:none; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:8px; padding:6px 10px 6px 7px; background:var(--surface-2)}
.pchip .r{font-family:var(--font-mono); font-weight:600; font-size:12px; color:var(--muted); min-width:17px; text-align:right}
.pchip .t{font-family:var(--font-display); font-weight:500; font-size:13.5px; letter-spacing:.01em; white-space:nowrap}
.pchip.playing{border-color:color-mix(in srgb,var(--accent) 45%, var(--line))}
.pchip.playing::after{content:""; width:6px;height:6px;border-radius:50%; background:var(--accent)}
.pchip.me{background:var(--accent); border-color:transparent}
.pchip.me .r,.pchip.me .t{color:#1a1204}
.pchip.me::after{background:#1a1204}
.poll-key{padding:9px 16px 0; font-size:11px; color:var(--muted)}
.poll-key i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block; margin-right:5px;vertical-align:middle}

/* footer */
footer{margin:40px 0 30px}
.foot-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:20px}
.foot-card h3{font-size:15px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px}
.how{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px}
@media (max-width:640px){ .how{grid-template-columns:1fr} }
.how .step{font-size:12.5px; color:var(--ink-soft); line-height:1.5}
.how .step b{display:block; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em; color:var(--ink); font-size:12.5px; margin-bottom:3px}
.how .step .num{color:var(--accent-2); font-family:var(--font-mono); font-weight:600}
.how .step .kbd{font-weight:600; color:var(--accent-2)}
.foot-meta{border-top:1px solid var(--line-soft); padding-top:14px; font-size:11.5px; color:var(--muted); line-height:1.6}

      const val=(b.hi!=null&&b.lo!=null)?Math.round((b.lo+b.hi)/2):(b.val!=null?b.val:0);
      return `<div class="prob"><div class="prob-top"><span class="prob-lab">${esc(b.label)}</span><span class="prob-val">${esc(b.disp)}</span></div><div class="prob-track"><div class="prob-fill" style="width:${Math.max(2,Math.min(100,val))}%"></div></div>${src}</div>`;

  function timelineHTML(){

    LEAGUES.forEach(k=>{ (DATA[k].games||[]).forEach(g=>{ if(g.away&&g.home&&g.day&&g.time) all.push({lg:k,day:g.day,time:g.time,away:g.away.name,home:g.home.name,tv:g.tv,mw:g.mustWatch}); }); });

  const FILTERS={
    college:[

      {id:"SEC",label:"SEC",test:g=>g.conf==="SEC"},
      {id:"B12",label:"Big 12",test:g=>g.conf==="B12"},
      {id:"ACC",label:"ACC",test:g=>g.conf==="ACC"},

  function playingSet(L){

    const add=g=>{ if(!g)return; [g.away,g.home].forEach(t=>t&&t.name&&s.add(t.name)); };

    (L.teams||[]).forEach(t=>{ if(t.pollName)s.add(t.pollName); if(t.game&&t.game.oppName)s.add(t.game.oppName); });

    if(g.favored&&g.spread) stats.push(["Favored",`${g.favored} ${spreadTxt(g.spread)}`,true]);
    if(g.ou) stats.push(["Over / Under",g.ou,false]);
    const join = g.home&&g.away ? `<span class="at">${L===DATA.hs?"at":"at"}</span>` : "";
    return `<section class="hero"><div class="hero-in">
      <div class="hero-top"><span class="gow-tag">Game of the Week</span>

  function rtable(caption,rows){

  function teamHTML(t){

    const rankChip = t.rank?`<span class="chip rank">#${t.rank}</span>`:`<span class="chip">Unranked</span>`;

      </button>${more}</article>`;

        <div class="step"><b><span class="num">02</span> Filter &amp; dig in</b>College filters by conference (Big Ten, SEC, Big 12, ACC) or Must-watch; NFL by prime time. Tap any highlighted game for stats &amp; a why-watch. Tyler's teams get the deep dive in every league.</div>
        <div class="step"><b><span class="num">03</span> Share</b>Hit <span class="kbd">Copy this slate</span> to drop the league you're viewing into a group chat.</div>
      </div>
      <div class="foot-meta"><div class="foot-brand">How the numbers work</div>
      <b>Playoff &amp; postseason odds</b> are published third-party estimates — ESPN FPI, betting-market implied probabilities and public simulation models — cited on each card with a source and an as-of date, and shown as a <b>range</b> when models disagree rather than a single figure. They are not a proprietary Saturday Slate model, and the CFP selection committee adds uncertainty no win-loss model fully captures. Where no defensible probability exists (Iowa State's CFP odds, all Iowa high school football), we show standings, RPI position and qualification scenarios instead of inventing a number. <b>Projections</b> (projected winner, score, confidence) are our editorial reads, clearly labeled — not verified facts or betting advice. We never fabricate stats, injuries, lines or results; unverifiable fields are left blank.
      <div class="foot-brand" style="margin-top:14px">Saturday Slate · Edition updated ${esc(DATA.updated)}</div>
      All kickoffs are Central and can shift for TV windows; betting lines are from major sportsbooks and move through the week. College ranks are AP Top 25; Iowa HS positions are the IHSAA Class 5A RPI. Built to refresh every Thursday — College, NFL and Iowa high school.</div></div></footer>`;
  }

  /* ---- interactions ---- */
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  // theme
  const root=document.documentElement, savedTheme=store.get("ss_theme");
  if(savedTheme==="dark"||savedTheme==="light") root.setAttribute("data-theme",savedTheme);
  $("#themeBtn").addEventListener("click",()=>{
    const cur=root.getAttribute("data-theme");
    const sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next=(cur?cur==="dark":sysDark)?"light":"dark";
    root.setAttribute("data-theme",next); store.set("ss_theme",next);
  });

  // league switching
  let activeLeague="college";
  function showLeague(key,scroll){
    if(!DATA[key]) key="college";
    activeLeague=key;
    document.querySelectorAll('.league').forEach(s=>s.hidden = s.dataset.league!==key);
    document.querySelectorAll('.lg-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.league===key)));
    store.set("ss_league",key);
    if(scroll){
      const sec=document.querySelector('.league[data-league="'+key+'"]');
      if(sec){ const tb=document.querySelector('.topbar'), nv=document.querySelector('.league-nav');
        const off=(tb?tb.getBoundingClientRect().height:0)+(nv?nv.getBoundingClientRect().height:0)+6;
        const top=window.pageYOffset+sec.getBoundingClientRect().top-off;
        window.scrollTo({top:Math.max(0,top),behavior:'auto'}); }
    }
  }
  nav.addEventListener("click",e=>{const b=e.target.closest("button[data-league]"); if(b) showLeague(b.dataset.league,true);});
  const savedLeague=store.get("ss_league");
  showLeague(LEAGUES.includes(savedLeague)?savedLeague:"college",false);

  // card expand (delegated across whole app)
  app.addEventListener("click",e=>{
    const btn=e.target.closest(".game-toggle"); if(!btn||btn.disabled) return;
    const id=btn.getAttribute("aria-controls"); if(!id) return;
    const more=document.getElementById(id); const open=btn.getAttribute("aria-expanded")==="true";
    btn.setAttribute("aria-expanded",String(!open)); if(more) more.hidden=open;
    const hint=btn.querySelector(".more-hint"); if(hint) hint.textContent=open?"Tap for more ›":"Show less ‹";
  });

  // rankings toggles
  document.querySelectorAll(".ranks-toggle").forEach(btn=>{
    const body=btn.nextElementSibling;
    btn.addEventListener("click",()=>{const open=btn.getAttribute("aria-expanded")==="true"; btn.setAttribute("aria-expanded",String(!open)); if(body) body.hidden=open;});
  });

  // filters (per league)
  const filterState={};
  document.querySelectorAll('.league').forEach(section=>{
    const key=section.dataset.league; const seg=section.querySelector('.seg'); if(!seg) return;
    const grid=section.querySelector('[data-grid]');
    function apply(id){
      const f=(FILTERS[key].find(x=>x.id===id))||FILTERS[key][0];
      grid.querySelectorAll('.game').forEach(card=>{const g=DATA[key].games[+card.dataset.i]; card.hidden=!(g&&f.test(g));});
      seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===id)));
      store.set("ss_filter_"+key,id);
    }
    seg.addEventListener('click',e=>{const b=e.target.closest('button[data-filter]'); if(b) apply(b.dataset.filter);});
    const saved=store.get("ss_filter_"+key);
    apply(saved&&FILTERS[key].some(f=>f.id===saved)?saved:"all");
  });

  // copy active league
  function buildShare(){
    const key=activeLeague, L=DATA[key]; const lines=[];
    lines.push(`SATURDAY SLATE — ${L.label} (${L.sub})`); lines.push("All times Central."); lines.push("");
    const g=L.gameOfWeek;
    if(g){ const a=(g.away.rank?`#${g.away.rank} `:"")+g.away.name, h=(g.home.rank?`#${g.home.rank} `:"")+g.home.name;
      lines.push("GAME OF THE WEEK"); lines.push(`- ${a} at ${h} — ${g.time} ${g.tv||""}${g.favored&&g.spread?` (${g.favored} ${spreadTxt(g.spread)})`:""}`.trim()); lines.push(""); }
    (L.teams||[]).forEach(t=>{ const tg=t.game; lines.push(`${t.name.toUpperCase()} (${t.record})`); lines.push(`- ${tg.ha} ${tg.opp} — ${tg.time} ${tg.tv||""}${tg.favored&&tg.spread?` (${tg.favored} ${spreadTxt(tg.spread)})`:""}`.trim()); });
    lines.push(""); lines.push("THE SLATE");
    (L.games||[]).forEach(x=>{ const a=(x.away.rank?`#${x.away.rank} `:"")+x.away.name, h=(x.home.rank?`#${x.home.rank} `:"")+x.home.name;
      const d=x.day&&!["SAT"].includes(x.day)?x.day+" ":""; const ln=x.favored&&x.spread?` (${x.favored} ${spreadTxt(x.spread)})`:"";
      lines.push(`- ${a} at ${h} — ${d}${x.time} ${x.tv||""}${ln}`.replace(/\s+/g," ").trim()); });
    lines.push(""); lines.push("— made with Saturday Slate");
    return lines.join("\n");
  }
  const toast=$("#toast"); let tT;
  function showToast(m){toast.textContent=m; toast.classList.add("show"); clearTimeout(tT); tT=setTimeout(()=>toast.classList.remove("show"),2200);}
  $("#copyBtn").addEventListener("click",async()=>{
    const text=buildShare();
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); showToast(`${DATA[activeLeague].label} slate copied`); return;} throw 0; }
    catch(e){ try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand&&document.execCommand("copy"); document.body.removeChild(ta); showToast(ok?`${DATA[activeLeague].label} slate copied`:"Press ⌘/Ctrl+C to copy"); }catch(e2){ showToast("Couldn't copy automatically"); } }
  });
})();
</script>
